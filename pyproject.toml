[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "court_cases"
version = "0.1.0"
description = "Virginia Court Case Scraper and Analysis Pipeline"
requires-python = ">=3.9"
dependencies = [
    "apache-airflow==3.1.3",
    "pandas==2.2.3",
    "sqlalchemy==1.4.54",
    "alembic==1.13.3",
    "requests",
    "requests-cache==1.2.1",
    "inflection==0.5.1",
    "psycopg2-binary==2.9.10",
    "scikit-learn==1.7.2",
    "scipy==1.16.3",
    "duckdb==1.1.3",
    "pygwalker==0.4.9.11",
    "matplotlib==3.10.8",
    "seaborn==0.13.2",
    "plotly==6.5.1",
    "streamlit==1.52.2",
    "tenacity",
    "requests-ratelimiter"
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
