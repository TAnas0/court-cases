# docker-compose.override.yml
#
# Auto-loaded by `docker compose` alongside docker-compose.yaml.
# Contains dev-only services that are NOT needed in production.
# To run without these services: docker compose -f docker-compose.yaml up -d

services:
  jupyter:
    image: jupyter/scipy-notebook:latest
    ports:
      - "8888:8888"
    volumes:
      - ${AIRFLOW_PROJ_DIR:-.}/src:/home/jovyan/work/src
      - ${AIRFLOW_PROJ_DIR:-.}/output:/home/jovyan/work/output
      - ${AIRFLOW_PROJ_DIR:-.}/notebooks:/home/jovyan/work/notebooks
      - duckdb-data:/home/jovyan/work/duckdb_data
    environment:
      - JUPYTER_ENABLE_LAB=yes
    command: start-notebook.sh --NotebookApp.token=''

  duck-ui:
    image: ghcr.io/ibero-data/duck-ui:latest
    restart: unless-stopped
    ports:
      - "5522:5522"
    volumes:
      - ./output/gold/court_analytics.duckdb:/data

volumes:
  duckdb-data:
